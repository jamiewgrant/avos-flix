<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <!-- Set the theme before first paint so light-mode visitors don't get a dark flash.
         Mirrors getInitial() in src/lib/useTheme.ts. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("avos-theme");
          if (stored === "dark" || stored === "light") theme = stored;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (/[?&](embed|boomer)=(1|true)(&|$)/.test(location.search)) {
          document.documentElement.classList.add("no-prerender");
        }
      })();
    </script>

    <!-- Fonts: Plus Jakarta Sans (display) + DM Mono (numbers/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!--seo:start-->
    <!-- Dev-server defaults. The build (scripts/prerender.mjs) replaces this
         block per page with the title, description, canonical URL, social tags
         and structured data from src/lib/pages.ts. -->
    <title>avos+flix — UK wages vs house prices and the cost of living, charted</title>
    <meta name="description" content="A UK economic dashboard: wages, house prices and the real cost of living, charted from official data." />
    <!--seo:end-->

    <!-- The build writes static HTML into #root. Embed and boomer modes are
         different layouts, so hide that markup until the app takes over. -->
    <style>html.no-prerender #root[data-prerendered] { visibility: hidden; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
